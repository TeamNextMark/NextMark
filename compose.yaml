# compose.yaml
# AI Assisted Grading System - Team NextMark
# Jetson Nano 8GB deployment
# Created: 2026-02-06 by Billy Tilmon
# Purpose: Define microservices (postgres, ollama, backend, nginx) in Docker containers
# Follows industry best practices: one process per container, named volumes, internal bridge network

services:

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: nextmark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nextmark-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextmark"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:5f7a20da9b4d42d1909b4693f90942135bcabc335ee42d529c0d143c44a92311}
    container_name: nextmark-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - nextmark-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BACKEND_BASE_IMAGE: ${BACKEND_BASE_IMAGE:-python:3.11-slim}
    container_name: nextmark-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: qwen3:4b
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - submissions-data:/var/lib/nextmark/submissions
    networks:
      - nextmark-net
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
      args:
        RUNNER_BASE_IMAGE: ${RUNNER_BASE_IMAGE:-python:3.11-slim}
    container_name: nextmark-runner
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUNNER_POLL_INTERVAL_SECONDS: 5
      RUNNER_WORKSPACE_BASE_DIR: /var/lib/nextmark/submissions
      RUNNER_SANDBOX_PYTHON_IMAGE: nextmark-sandbox-python:latest
      RUNNER_SANDBOX_CPP_IMAGE: nextmark-sandbox-cpp:latest
      RUNNER_CPU_LIMIT: 0.5
      RUNNER_MEMORY_LIMIT: 256m
      RUNNER_PIDS_LIMIT: 64
      RUNNER_TIMEOUT_SECONDS: 10
      RUNNER_SANDBOX_TMPFS_SIZE: 64m
      RUNNER_APPARMOR_PROFILE: ${RUNNER_APPARMOR_PROFILE:-}
      RUNNER_SECCOMP_PROFILE: ${RUNNER_SECCOMP_PROFILE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - submissions-data:/var/lib/nextmark/submissions
    networks:
      - nextmark-net
    depends_on:
      postgres:
        condition: service_healthy

  sandbox-python:
    build:
      context: .
      dockerfile: runner/sandbox_images/python/Dockerfile
      args:
        SANDBOX_PYTHON_BASE_IMAGE: ${SANDBOX_PYTHON_BASE_IMAGE:-python:3.11-alpine}
    image: nextmark-sandbox-python:latest
    profiles: ["sandbox-images"]

  sandbox-cpp:
    build:
      context: .
      dockerfile: runner/sandbox_images/cpp/Dockerfile
      args:
        SANDBOX_CPP_BASE_IMAGE: ${SANDBOX_CPP_BASE_IMAGE:-gcc:14}
    image: nextmark-sandbox-cpp:latest
    profiles: ["sandbox-images"]

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    container_name: nextmark-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    networks:
      - nextmark-net
    depends_on:
      - backend

networks:
  nextmark-net:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
  submissions-data:
